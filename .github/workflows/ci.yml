name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Enable pinned pnpm
        run: |
          corepack enable pnpm
          corepack install
          pnpm --version
      - uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1.7.2
        with:
          sdk: 3.10.0
      - run: pnpm install --frozen-lockfile
      - name: Install the pinned SMF CLI
        shell: bash
        run: |
          version="$(tr -d '\r\n' < SMF_CLI_VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "SMF_CLI_VERSION must contain one semantic version." >&2
            exit 1
          fi
          DART_DATA_HOME="$RUNNER_TEMP/smf-cli" dart install smf_cli "$version"
          executable="$RUNNER_TEMP/smf-cli/install/bin/smf"
          test "$("$executable" --version)" = "$version"
          printf 'SMF_TEST_EXECUTABLE=%s\n' "$executable" >> "$GITHUB_ENV"
      - run: pnpm run check
      - if: matrix.node == 20
        run: pnpm run audit:prod
      - if: matrix.node == 20
        run: pnpm run audit
      - run: git diff --exit-code -- dist
