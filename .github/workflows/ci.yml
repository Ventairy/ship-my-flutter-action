name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Enable pinned pnpm
        run: |
          corepack enable pnpm
          corepack install
          pnpm --version
      - uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1.7.2
        with:
          sdk: 3.10.0
      - run: pnpm install --frozen-lockfile
      - run: dart pub get --enforce-lockfile -C vendor/smf
      - run: pnpm run check
      - if: matrix.node == 20
        run: pnpm run audit:prod
      - if: matrix.node == 20
        run: pnpm run audit
      - run: git diff --exit-code -- dist
      - id: smf
        if: matrix.node == 20
        name: Read vendored SMF provenance
        shell: bash
        run: |
          smf_commit="$(tr -d '\r\n' < vendor/smf/SMF_COMMIT)"
          if [[ ! "$smf_commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "SMF_COMMIT must contain one full lowercase Git SHA." >&2
            exit 1
          fi
          printf 'commit=%s\n' "$smf_commit" >> "$GITHUB_OUTPUT"
      - if: matrix.node == 20
        name: Check out recorded SMF workspace
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: Ventairy/smf
          ref: ${{ steps.smf.outputs.commit }}
          path: upstream-smf
          persist-credentials: false
      - if: matrix.node == 20
        name: Verify vendored SMF provenance
        shell: bash
        run: |
          for package in smf_hooks smf_engine smf_apple smf_cli; do
            diff -ru "upstream-smf/packages/$package/lib" "vendor/smf/packages/$package/lib"
            cmp "upstream-smf/packages/$package/pubspec.yaml" "vendor/smf/packages/$package/pubspec.yaml"
            cmp "upstream-smf/packages/$package/LICENSE" "vendor/smf/packages/$package/LICENSE"
            cmp "upstream-smf/packages/$package/NOTICE" "vendor/smf/packages/$package/NOTICE"
          done
          diff -ru upstream-smf/packages/smf_cli/bin vendor/smf/packages/smf_cli/bin
