name: Sync SMF

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: Optional stable smf_cli release tag to synchronize
        required: false
        type: string

concurrency:
  group: sync-smf
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - id: release
        name: Resolve stable SMF CLI release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          tag="$REQUESTED_TAG"
          if [[ -z "$tag" ]]; then
            tag="$(
              gh api "repos/Ventairy/smf/releases?per_page=100" \
                --jq '
                  map(
                    select(
                      .draft == false and
                      .prerelease == false and
                      (.tag_name | test("^smf_cli-v[0-9]+\\.[0-9]+\\.[0-9]+$"))
                    )
                  )
                  | sort_by(.published_at)
                  | last
                  | .tag_name
                '
            )"
          fi

          if [[ ! "$tag" =~ ^smf_cli-v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "SMF synchronization requires a stable smf_cli release tag." >&2
            exit 1
          fi
          version="${BASH_REMATCH[1]}"

          release="$(
            gh api "repos/Ventairy/smf/releases/tags/$tag" \
              --jq '[.draft, .prerelease, .html_url] | @tsv'
          )"
          IFS=$'\t' read -r is_draft is_prerelease release_url <<< "$release"
          if [[ "$is_draft" != "false" || "$is_prerelease" != "false" ]]; then
            echo "SMF synchronization requires a published stable release." >&2
            exit 1
          fi

          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'url=%s\n' "$release_url" >> "$GITHUB_OUTPUT"

      - name: Check out smf-action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

      - id: version
        name: Compare recorded and released CLI versions
        env:
          RELEASED_VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          current_version="$(tr -d '\r\n' < SMF_CLI_VERSION)"
          if [[ ! "$current_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "SMF_CLI_VERSION must contain one semantic version." >&2
            exit 1
          fi
          if [[ "$current_version" == "$RELEASED_VERSION" ]]; then
            echo "is-current=true" >> "$GITHUB_OUTPUT"
          else
            echo "is-current=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.version.outputs.is-current == 'false'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          package-manager-cache: false

      - if: steps.version.outputs.is-current == 'false'
        name: Enable pinned pnpm
        shell: bash
        run: |
          corepack enable pnpm
          corepack install
          pnpm --version

      - if: steps.version.outputs.is-current == 'false'
        uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1.7.2
        with:
          sdk: 3.10.0

      - if: steps.version.outputs.is-current == 'false'
        name: Record and install released SMF CLI
        env:
          RELEASED_VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          printf '%s\n' "$RELEASED_VERSION" > SMF_CLI_VERSION
          DART_DATA_HOME="$RUNNER_TEMP/smf-cli" \
            dart install smf_cli "$RELEASED_VERSION"
          executable="$RUNNER_TEMP/smf-cli/install/bin/smf"
          test "$("$executable" --version)" = "$RELEASED_VERSION"
          printf 'SMF_TEST_EXECUTABLE=%s\n' "$executable" >> "$GITHUB_ENV"

      - if: steps.version.outputs.is-current == 'false'
        name: Install Action dependencies
        run: pnpm install --frozen-lockfile

      - if: steps.version.outputs.is-current == 'false'
        name: Validate synchronized CLI
        shell: bash
        run: |
          pnpm run check
          pnpm run audit:prod
          pnpm run audit
          git diff --exit-code -- dist

      - if: steps.version.outputs.is-current == 'false'
        id: pull-request
        name: Open or update synchronization pull request
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_URL: ${{ steps.release.outputs.url }}
          RELEASED_VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          branch="automation/sync-smf"
          title="fix(runtime): use smf_cli $RELEASED_VERSION"

          git config user.name "smf-release-bot"
          git config user.email "smf-release-bot@users.noreply.github.com"
          git switch -c "$branch"
          git add SMF_CLI_VERSION
          git commit -m "$title"
          git fetch origin "$branch:refs/remotes/origin/$branch" || true
          git push --force-with-lease origin "HEAD:refs/heads/$branch"

          {
            printf '## What changed\n\n'
            printf 'Updated the Action to install [%s](%s).\n\n' \
              "$RELEASE_TAG" "$RELEASE_URL"
            printf -- '- CLI version: `%s`\n' "$RELEASED_VERSION"
            printf -- '- Runtime source: published `smf_cli` executable\n\n'
            printf 'The default `fix(runtime)` classification produces an Action patch release. '
            printf 'Change the pull request title before merge if the Action-facing behavior is minor or breaking.\n\n'
            printf '## Verification\n\n'
            printf -- '- installed `smf_cli %s` from pub.dev\n' "$RELEASED_VERSION"
            printf -- '- `pnpm run check`\n'
            printf -- '- production and full dependency audits\n'
            printf -- '- checked-in `dist` bundle has no drift\n'
          } > "$RUNNER_TEMP/smf-sync-pr.md"

          pull_request_url="$(
            gh pr list \
              --head "$branch" \
              --state open \
              --json url \
              --jq '.[0].url'
          )"
          if [[ -n "$pull_request_url" ]]; then
            gh pr edit "$pull_request_url" \
              --title "$title" \
              --body-file "$RUNNER_TEMP/smf-sync-pr.md"
          else
            pull_request_url="$(
              gh pr create \
                --base main \
                --head "$branch" \
                --title "$title" \
                --body-file "$RUNNER_TEMP/smf-sync-pr.md"
            )"
          fi
          printf 'url=%s\n' "$pull_request_url" >> "$GITHUB_OUTPUT"

      - name: Summarize synchronization
        env:
          IS_CURRENT: ${{ steps.version.outputs.is-current }}
          PULL_REQUEST_URL: ${{ steps.pull-request.outputs.url }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_URL: ${{ steps.release.outputs.url }}
          RELEASED_VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          {
            printf '## SMF CLI synchronization\n\n'
            printf -- '- Release: [%s](%s)\n' "$RELEASE_TAG" "$RELEASE_URL"
            printf -- '- Version: `%s`\n' "$RELEASED_VERSION"
            if [[ "$IS_CURRENT" == "true" ]]; then
              printf -- '- Result: the Action already installs this CLI version\n'
            else
              printf -- '- Pull request: %s\n' "$PULL_REQUEST_URL"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
