name: Release Please

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

concurrency:
  group: release-please
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - id: tested-head
        name: Verify the tested commit is still main
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          if [[ "$current_sha" == "$TESTED_SHA" ]]; then
            echo "is-current=true" >> "$GITHUB_OUTPUT"
          else
            echo "is-current=false" >> "$GITHUB_OUTPUT"
          fi

      - id: release
        name: Open or publish the release
        if: steps.tested-head.outputs.is-current == 'true'
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

      - name: Summarize Marketplace publication
        if: steps.release.outputs.release_created == 'true'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
          RELEASE_URL: ${{ steps.release.outputs.html_url }}
        shell: bash
        run: |
          {
            printf '## %s is ready to publish\n\n' "$RELEASE_TAG"
            printf 'Release Please created a tested draft release.\n\n'
            printf 'Open [%s](%s), select **Publish this Action to the GitHub Marketplace**, confirm **Publishing** and **Mobile CI**, then publish the release.\n' "$RELEASE_TAG" "$RELEASE_URL"
          } >> "$GITHUB_STEP_SUMMARY"
