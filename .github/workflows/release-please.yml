name: Release Please

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

concurrency:
  group: release-please
  cancel-in-progress: false

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - id: tested-head
        name: Verify the tested commit is still main
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          if [[ "$current_sha" == "$TESTED_SHA" ]]; then
            echo "is-current=true" >> "$GITHUB_OUTPUT"
          else
            echo "is-current=false" >> "$GITHUB_OUTPUT"
          fi

      - id: release
        name: Open or publish the release
        if: steps.tested-head.outputs.is-current == 'true'
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

      - name: Validate the release pull request
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          RELEASE_PRS: ${{ steps.release.outputs.prs }}
        shell: bash
        run: |
          branch="$(jq -er '
            if type == "array" and length == 1 then
              .[0].headBranchName
            else
              error("expected exactly one release pull request")
            end
          ' <<<"$RELEASE_PRS")"
          if [[ -z "$branch" ]]; then
            echo "Release Please did not return a release PR branch." >&2
            exit 1
          fi
          gh workflow run ci.yml --ref "$branch"

      - name: Update floating Action tags
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          MAJOR: ${{ steps.release.outputs.major }}
          MINOR: ${{ steps.release.outputs.minor }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        shell: bash
        run: |
          if [[ ! "$MAJOR" =~ ^[0-9]+$ || ! "$MINOR" =~ ^[0-9]+$ ]]; then
            echo "Release Please returned invalid major or minor outputs." >&2
            exit 1
          fi
          if [[ ! "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Release Please returned an invalid release SHA." >&2
            exit 1
          fi

          update_tag() {
            local tag="$1"
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
              gh api \
                --method PATCH \
                "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag" \
                -f sha="$RELEASE_SHA" \
                -F force=true \
                >/dev/null
            else
              gh api \
                --method POST \
                "repos/$GITHUB_REPOSITORY/git/refs" \
                -f ref="refs/tags/$tag" \
                -f sha="$RELEASE_SHA" \
                >/dev/null
            fi
          }

          update_tag "v$MAJOR"
          update_tag "v$MAJOR.$MINOR"
