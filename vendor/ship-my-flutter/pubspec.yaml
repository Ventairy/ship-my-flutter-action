name: ship_my_flutter
description: Release PRs, TestFlight candidates, and App Store submission for Flutter apps.
version: 0.1.0
repository: https://github.com/Ventairy/ship-my-flutter
issue_tracker: https://github.com/Ventairy/ship-my-flutter/issues
topics:
  - flutter
  - ios
  - release
  - testflight

environment:
  sdk: ">=3.10.0 <4.0.0"

executables:
  ship-my-flutter: ship_my_flutter

dependencies:
  args: ^2.7.0
  crypto: ^3.0.7
  dart_jsonwebtoken: ^3.4.1
  http: ^1.5.0
  path: ^1.9.1
  pub_semver: ^2.2.0
  xml: ^6.6.1
  yaml: ^3.1.3

dev_dependencies:
  lints: ^6.0.0
  # 1.31.x pulls analyzer releases whose locked graph requires Dart 3.11.
  # Keep development and the vendored Action runtime reproducible on our 3.10 floor.
  test: 1.30.0
