name: ship_my_flutter
description: Release PRs, TestFlight candidates, and App Store submission for Flutter apps.
version: 0.1.0
repository: https://github.com/Ventairy/ship-my-flutter
issue_tracker: https://github.com/Ventairy/ship-my-flutter/issues
topics:
  - flutter
  - ios
  - release
  - testflight

environment:
  sdk: ">=3.10.0 <4.0.0"

executables:
  ship-my-flutter: ship_my_flutter

dependencies:
  args: ^2.7.0
  crypto: ^3.0.7
  dart_jsonwebtoken: ^3.4.1
  freezed_annotation: ^3.1.0
  http: ^1.5.0
  json_annotation: ^4.11.0
  path: ^1.9.1
  pub_semver: ^2.2.0
  xml: ^6.6.1
  yaml: ^3.1.3

dev_dependencies:
  build_runner: ^2.15.0
  # test_core permits 3.2.0, which expects an SDK snapshot removed before our
  # Dart 3.10 floor. Version 4 uses the supported AOT frontend server snapshot.
  frontend_server_client: ^4.0.0
  freezed: ">=3.2.5 <3.2.6"
  json_serializable: ">=6.13.0 <6.13.1"
  lints: ^6.0.0
  # 1.31.x pulls analyzer releases whose locked graph requires Dart 3.11.
  # Keep development and the vendored Action runtime reproducible on our 3.10 floor.
  test: 1.30.0
