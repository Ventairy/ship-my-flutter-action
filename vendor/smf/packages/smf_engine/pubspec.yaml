name: smf_engine
description: Release planning and Apple and Android delivery for SMF.
version: 1.0.2
repository: https://github.com/Ventairy/smf
issue_tracker: https://github.com/Ventairy/smf/issues
topics:
  - flutter
  - ios
  - android
  - release
  - automation

environment:
  sdk: ">=3.10.0 <4.0.0"

resolution: workspace

dependencies:
  crypto: ^3.0.7
  dart_jsonwebtoken: ^3.4.1
  freezed_annotation: ^3.1.0
  googleapis: ^16.0.0
  googleapis_auth: ^2.3.3
  http: ^1.5.0
  json_annotation: ^4.12.0
  path: ^1.9.1
  pub_semver: ^2.2.0
  smf_hooks: ^1.0.0
  xml: ^6.6.1
  yaml: ^3.1.3

dev_dependencies:
  build_runner: 2.15.1
  freezed: ">=3.2.5 <3.2.6"
  frontend_server_client: ^4.0.0
  json_serializable: ^6.14.0
  # test 1.31.x requires analyzer 13+, while the latest freezed requires
  # analyzer <11.
  test: 1.30.0
