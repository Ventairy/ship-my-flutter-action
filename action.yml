name: SMF
description: Open app-scoped Flutter release PRs, publish store candidates, and ship each exact tested platform build.
author: Ventairy

branding:
  icon: upload-cloud
  color: blue

inputs:
  phase:
    description: "Workflow phase: pull-request, release-candidate, or ship."
    required: true
  platform:
    description: Optional platform filter for any phase (ios or android).
    required: false
  smf-path:
    description: Explicit app/smf directory when the repository contains multiple apps.
    required: false
  github-token:
    description: GitHub token used for release PRs, receipts, labels, and releases.
    required: false
    default: ${{ github.token }}
  app-store-connect-key-id:
    description: App Store Connect API key ID.
    required: false
  app-store-connect-issuer-id:
    description: App Store Connect API issuer ID.
    required: false
  app-store-connect-auth-key-base64:
    description: Base64-encoded App Store Connect AuthKey_*.p8 file.
    required: false
  ios-certificate-base64:
    description: Base64-encoded Apple Distribution .p12 certificate.
    required: false
  ios-certificate-password:
    description: Password for the Apple Distribution .p12 certificate.
    required: false
  google-play-service-account-json:
    description: Complete Google Play service-account JSON.
    required: false
  android-keystore-base64:
    description: Base64-encoded Google Play upload keystore.
    required: false
  android-key-alias:
    description: Alias of the Google Play upload key.
    required: false
  android-keystore-password:
    description: Password protecting the Android upload keystore.
    required: false
  android-key-password:
    description: Password protecting the Android upload key.
    required: false

outputs:
  next-phase:
    description: Phase selected by pull-request (noop, release-candidate, or ship).
    value: ${{ steps.run.outputs.next-phase }}
  targets:
    description: JSON matrix of platform and version targets selected by pull-request.
    value: ${{ steps.run.outputs.targets }}
  release-branch:
    description: Release PR branch selected by pull-request for a candidate checkout.
    value: ${{ steps.run.outputs.release-branch }}
  pull-request-number:
    description: Release pull request number selected by pull-request.
    value: ${{ steps.run.outputs.pull-request-number }}
  candidates:
    description: JSON list of release-candidate receipts produced by release-candidate.
    value: ${{ steps.run.outputs.candidates }}
  releases:
    description: JSON list of platform release evidence produced by ship.
    value: ${{ steps.run.outputs.releases }}
  platform:
    description: Platform convenience output when exactly one target, candidate, or release exists.
    value: ${{ steps.run.outputs.platform }}
  version:
    description: Version convenience output when exactly one target, candidate, or release exists.
    value: ${{ steps.run.outputs.version }}
  artifact-id:
    description: Store artifact identifier (Apple build ID or Google Play versionCode).
    value: ${{ steps.run.outputs.artifact-id }}
  build-number:
    description: Platform build number or Google Play versionCode.
    value: ${{ steps.run.outputs.build-number }}
  release-url:
    description: GitHub Release URL.
    value: ${{ steps.run.outputs.release-url }}

runs:
  using: composite
  steps:
    - name: Preserve consumer toolchain
      id: consumer-toolchain
      shell: bash
      run: |
        if [[ "$PATH" == *$'\n'* || "$PATH" == *$'\r'* ]]; then
          echo "PATH cannot contain a newline." >&2
          exit 1
        fi
        printf 'path=%s\n' "$PATH" >> "$GITHUB_OUTPUT"

    - name: Set up Dart
      uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1.7.2
      with:
        sdk: 3.10.0

    - name: Resolve SMF toolchain
      id: smf-toolchain
      shell: bash
      run: |
        dart_path="$(command -v dart)"
        if [[ -z "$dart_path" || "$dart_path" == *$'\n'* || "$dart_path" == *$'\r'* ]]; then
          echo "Could not resolve the smf Dart executable." >&2
          exit 1
        fi
        printf 'dart=%s\n' "$dart_path" >> "$GITHUB_OUTPUT"

    - name: Resolve smf dependencies
      shell: bash
      env:
        SMF_DART: ${{ steps.smf-toolchain.outputs.dart }}
      run: '"$SMF_DART" pub get --enforce-lockfile -C "$GITHUB_ACTION_PATH/vendor/smf"'

    - name: SMF
      id: run
      shell: bash
      env:
        INPUT_PHASE: ${{ inputs.phase }}
        INPUT_PLATFORM: ${{ inputs.platform }}
        INPUT_SMF_PATH: ${{ inputs.smf-path }}
        SMF_GITHUB_TOKEN: ${{ inputs.github-token }}
        SMF_DART: ${{ steps.smf-toolchain.outputs.dart }}
        SMF_CONSUMER_PATH: ${{ steps.consumer-toolchain.outputs.path }}
        SMF_APP_STORE_CONNECT_KEY_ID: ${{ inputs.app-store-connect-key-id }}
        SMF_APP_STORE_CONNECT_ISSUER_ID: ${{ inputs.app-store-connect-issuer-id }}
        SMF_APP_STORE_CONNECT_AUTH_KEY_BASE64: ${{ inputs.app-store-connect-auth-key-base64 }}
        SMF_IOS_CERTIFICATE_BASE64: ${{ inputs.ios-certificate-base64 }}
        SMF_IOS_CERTIFICATE_PASSWORD: ${{ inputs.ios-certificate-password }}
        SMF_GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ inputs.google-play-service-account-json }}
        SMF_ANDROID_KEYSTORE_BASE64: ${{ inputs.android-keystore-base64 }}
        SMF_ANDROID_KEY_ALIAS: ${{ inputs.android-key-alias }}
        SMF_ANDROID_KEYSTORE_PASSWORD: ${{ inputs.android-keystore-password }}
        SMF_ANDROID_KEY_PASSWORD: ${{ inputs.android-key-password }}
      run: node "$GITHUB_ACTION_PATH/dist/index.js"
